      - name: Publish APK in Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${GITHUB_RUN_NUMBER}" vwproj/app/build/outputs/apk/debug/app-debug.apk --title "Volume Widget v${GITHUB_RUN_NUMBER}" --notes "Debug APK"
