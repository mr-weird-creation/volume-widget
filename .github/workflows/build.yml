name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Write project files
        run: |
          mkdir -p "vwproj/$(dirname app/src/main/java/com/example/volumewidget/VolumeStreams.kt)"
          cat > vwproj/app/src/main/java/com/example/volumewidget/VolumeStreams.kt <<'VWEOF'
          package com.example.volumewidget

          import android.content.Context
          import android.media.AudioManager

          data class VolStream(val id: Int, val label: String, val icon: Int)

          object VolumeStreams {
              val all = listOf(
                  VolStream(AudioManager.STREAM_MUSIC, "মিডিয়া", R.drawable.ic_music),
                  VolStream(AudioManager.STREAM_RING, "রিংটোন", R.drawable.ic_ring),
                  VolStream(AudioManager.STREAM_NOTIFICATION, "নোটিফিকেশন", R.drawable.ic_bell),
                  VolStream(AudioManager.STREAM_SYSTEM, "সিস্টেম", R.drawable.ic_system),
                  VolStream(AudioManager.STREAM_VOICE_CALL, "কল", R.drawable.ic_call),
                  VolStream(AudioManager.STREAM_ALARM, "অ্যালার্ম", R.drawable.ic_alarm),
              )

              private fun audio(c: Context) = c.getSystemService(AudioManager::class.java)

              fun min(c: Context, s: VolStream) = audio(c).getStreamMinVolume(s.id)
              fun max(c: Context, s: VolStream) = audio(c).getStreamMaxVolume(s.id)
              fun get(c: Context, s: VolStream) = audio(c).getStreamVolume(s.id)

              /** false হলে সিস্টেম বদলাতে দেয়নি (যেমন Do Not Disturb চালু) */
              fun set(c: Context, s: VolStream, v: Int): Boolean = try {
                  audio(c).setStreamVolume(s.id, v.coerceIn(min(c, s), max(c, s)), 0)
                  true
              } catch (e: SecurityException) {
                  false
              }
          }
          VWEOF
          mkdir -p "vwproj/$(dirname app/src/main/java/com/example/volumewidget/VolumeWidgetProvider.kt)"
          cat > vwproj/app/src/main/java/com/example/volumewidget/VolumeWidgetProvider.kt <<'VWEOF'
          package com.example.volumewidget

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews

          class VolumeWidgetProvider : AppWidgetProvider() {

              override fun onUpdate(context: Context, manager: AppWidgetManager, appWidgetIds: IntArray) {
                  val iconIds = intArrayOf(
                      R.id.icon0, R.id.icon1, R.id.icon2, R.id.icon3, R.id.icon4, R.id.icon5
                  )
                  val views = RemoteViews(context.packageName, R.layout.widget_volume)
                  iconIds.forEachIndexed { i, viewId ->
                      val intent = Intent(context, VolumePopupActivity::class.java)
                          .putExtra(VolumePopupActivity.EXTRA_INDEX, i)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      val pending = PendingIntent.getActivity(
                          context, i, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      views.setOnClickPendingIntent(viewId, pending)
                  }
                  appWidgetIds.forEach { manager.updateAppWidget(it, views) }
              }
          }
          VWEOF
          mkdir -p "vwproj/$(dirname app/src/main/java/com/example/volumewidget/VolumePopupActivity.kt)"
          cat > vwproj/app/src/main/java/com/example/volumewidget/VolumePopupActivity.kt <<'VWEOF'
          package com.example.volumewidget

          import android.app.Activity
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast

          class VolumePopupActivity : Activity() {

              companion object {
                  const val EXTRA_INDEX = "index"
                  private const val AUTO_CLOSE_MS = 3000L
              }

              private val handler = Handler(Looper.getMainLooper())
              private val closeTask = Runnable { finish() }
              private val teal = Color.parseColor("#00897B")

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val index = intent.getIntExtra(EXTRA_INDEX, 0).coerceIn(0, VolumeStreams.all.lastIndex)
                  val stream = VolumeStreams.all[index]
                  val lo = VolumeStreams.min(this, stream)
                  val hi = VolumeStreams.max(this, stream)

                  val value = TextView(this).apply {
                      setTextColor(teal)
                      textSize = 15f
                      gravity = Gravity.CENTER
                      minWidth = dp(28)
                  }
                  val bar = SeekBar(this).apply {
                      this.max = hi - lo
                      progress = VolumeStreams.get(this@VolumePopupActivity, stream) - lo
                      progressTintList = ColorStateList.valueOf(teal)
                      thumbTintList = ColorStateList.valueOf(teal)
                      progressBackgroundTintList = ColorStateList.valueOf(Color.argb(70, 0, 137, 123))
                  }

                  fun show() {
                      value.text = (bar.progress + lo).toString()
                  }

                  fun setLevel(level: Int) {
                      if (!VolumeStreams.set(this, stream, level)) {
                          Toast.makeText(this, "Do Not Disturb বন্ধ করুন বা অনুমতি দিন", Toast.LENGTH_SHORT).show()
                      }
                      bar.progress = VolumeStreams.get(this, stream) - lo
                      show()
                      handler.removeCallbacks(closeTask)
                      handler.postDelayed(closeTask, AUTO_CLOSE_MS)
                  }

                  bar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar, p: Int, fromUser: Boolean) {
                          if (fromUser) setLevel(p + lo)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar) {}
                      override fun onStopTrackingTouch(sb: SeekBar) {}
                  })

                  fun roundButton(label: String, delta: Int) = TextView(this).apply {
                      text = label
                      textSize = 22f
                      setTextColor(teal)
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.argb(45, 0, 137, 123))
                      }
                      layoutParams = LinearLayout.LayoutParams(dp(40), dp(40))
                      setOnClickListener { setLevel(bar.progress + lo + delta) }
                  }

                  val icon = ImageView(this).apply {
                      setImageResource(stream.icon)
                      layoutParams = LinearLayout.LayoutParams(dp(26), dp(26)).apply { marginEnd = dp(10) }
                  }

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(16), dp(8), dp(16), dp(8))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#C0CA33"))
                          cornerRadius = dp(28).toFloat()
                      }
                      elevation = dp(8).toFloat()
                      isClickable = true
                      addView(icon)
                      addView(roundButton("−", -1))
                      addView(bar, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      addView(roundButton("+", 1))
                      addView(value)
                  }

                  val root = FrameLayout(this).apply {
                      setOnClickListener { finish() }
                      addView(
                          card,
                          FrameLayout.LayoutParams(dp(320), dp(56), Gravity.CENTER)
                      )
                  }

                  show()
                  setContentView(root)
                  handler.postDelayed(closeTask, AUTO_CLOSE_MS)
              }

              override fun onDestroy() {
                  handler.removeCallbacks(closeTask)
                  super.onDestroy()
              }
          }
          VWEOF
          mkdir -p "vwproj/$(dirname app/src/main/java/com/example/volumewidget/MainActivity.kt)"
          cat > vwproj/app/src/main/java/com/example/volumewidget/MainActivity.kt <<'VWEOF'
          package com.example.volumewidget

          import android.app.Activity
          import android.os.Bundle
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 64, 48, 48)
                  }
                  VolumeStreams.all.forEach { s ->
                      val lo = VolumeStreams.min(this, s)
                      root.addView(TextView(this).apply { text = s.label; textSize = 18f; setPadding(0, 32, 0, 0) })
                      root.addView(SeekBar(this).apply {
                          max = VolumeStreams.max(this@MainActivity, s) - lo
                          progress = VolumeStreams.get(this@MainActivity, s) - lo
                          setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                              override fun onProgressChanged(sb: SeekBar, p: Int, fromUser: Boolean) {
                                  if (fromUser) VolumeStreams.set(this@MainActivity, s, p + lo)
                              }
                              override fun onStartTrackingTouch(sb: SeekBar) {}
                              override fun onStopTrackingTouch(sb: SeekBar) {}
                          })
                      })
                  }
                  setContentView(ScrollView(this).apply { addView(root) })
              }
          }
